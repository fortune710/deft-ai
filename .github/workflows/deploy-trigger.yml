name: Deploy Trigger.dev Jobs

on:
  push:
    branches:
      - main
    paths:
      - 'trigger/**'
      - 'trigger.config.ts'
      - 'package.json'
  pull_request:
    branches:
      - main
    paths:
      - 'trigger/**'
      - 'trigger.config.ts'
      - 'package.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Deploy Trigger.dev jobs
        env:
          TRIGGER_SECRET_KEY: ${{ secrets.TRIGGER_SECRET_KEY }}
        run: bun run trigger:deploy

