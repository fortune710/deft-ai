name: Deploy Trigger.dev Jobs

on:
  push:
    branches:
      - main
    paths:
      - 'trigger/**'
      - 'trigger.config.ts'
      - 'package.json'
  pull_request:
    branches:
      - main
    paths:
      - 'trigger/**'
      - 'trigger.config.ts'
      - 'package.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Deploy Trigger.dev jobs
        env:
          TRIGGER_SECRET_KEY: ${{ secrets.TRIGGER_SECRET_KEY }}
        run: npm run trigger:deploy

